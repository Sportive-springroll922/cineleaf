name: Feature request
description: Suggest a focused improvement for local video editing.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What editing problem would this solve?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Describe the simplest useful workflow
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Local-first fit
      options:
        - label: This can work without an account, paid API, or uploading media.
          required: true
