name: Bug report
description: Tell us about something that did not work.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please use non-private or synthetic media and remove personal paths.
  - type: input
    id: version
    attributes:
      label: Cineleaf version or commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
