name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cineleaf-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Verify private brief is not tracked
        shell: pwsh
        run: |
          if (git ls-files | Select-String -Pattern '(^|/)instructions[.,]*\.md$' -CaseSensitive:$false) {
            throw 'A private instructions file is tracked.'
          }
      - name: Install installer compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build, test, and package Windows release
        shell: pwsh
        run: ./scripts/build_windows_release.ps1
      - name: Upload Windows release candidates
        uses: actions/upload-artifact@v7
        with:
          name: cineleaf-windows-x64
          path: |
            dist/Cineleaf-0.1.0-beta.1-Windows-x64-Setup.exe
            dist/Cineleaf-0.1.0-beta.1-Windows-x64-Portable.zip
            dist/Cineleaf-0.1.0-beta.1-Windows-SHA256SUMS.txt
          if-no-files-found: error
